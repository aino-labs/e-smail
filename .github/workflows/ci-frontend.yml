name: linter-frontend
on:
  pull_request:
    branches: [dev]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Используем Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install ci
        run: npm ci
        working-directory: frontend

      - name: run-lint
        run: npm run lint
        working-directory: frontend
