# Websocket-апгрейд: для обычных запросов Connection: close, для ws — upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name e-smail.ru www.e-smail.ru;
    return 301 https://$host$request_uri;
}

server {
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    server_name e-smail.ru www.e-smail.ru;

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/e-smail.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/e-smail.ru/privkey.pem;

    root /build;
    index index.html;

    # Встроенный DNS Docker. Имена сервисов резолвятся в рантайме через переменную
    # в proxy_pass, поэтому nginx стартует даже если backend временно недоступен
    # (literal-имя резолвится на старте и роняет контейнер — это и было причиной).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Общие proxy-заголовки — наследуются всеми location ниже
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/user/ {
        set $upstream_user user-service:8081;
        proxy_pass http://$upstream_user$request_uri;
    }

    location /api/v1/email/ {
        set $upstream_email email-service:8082;
        proxy_pass http://$upstream_email$request_uri;
    }

    location /api/v1/folder/ {
        set $upstream_folder folder-service:8083;
        proxy_pass http://$upstream_folder$request_uri;
    }

    location /api/v1/support/ {
        set $upstream_support support-service:8084;
        proxy_pass http://$upstream_support$request_uri;
    }

    location /avatars/ {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
